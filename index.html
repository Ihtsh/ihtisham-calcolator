<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#10131d">
	<title>Calcula — Calculator</title>
	<style>
		:root{color-scheme:dark;--bg:#0c0f17;--panel:#151a27;--panel2:#1b2231;--line:#293247;--text:#f4f6fb;--muted:#8d98ad;--accent:#8b7cff;--accent2:#a69aff;--danger:#fb7185;--shadow:0 24px 70px #0007}
		*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#27234a 0,transparent 35%),radial-gradient(ellipse at 100% 100%,#142a3b 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 16px}
		button{font:inherit;color:inherit;cursor:pointer}.app{width:min(100%,1040px);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:stretch}.calculator,.side{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.calculator{padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#5a9cff);display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:0 7px 24px #7465ff55}.brand strong{display:block;font-size:16px;letter-spacing:.01em}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.top-actions{display:flex;gap:8px}.icon-btn,.mode-btn,.clear-btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 12px;color:var(--muted);transition:.18s}.icon-btn{width:40px;height:40px;padding:0;font-size:17px}.icon-btn:hover,.mode-btn:hover,.clear-btn:hover{border-color:var(--accent);color:var(--text)}.display{min-height:150px;padding:18px 20px 16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#101522,#111725);margin-bottom:18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.display:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#776cff10;right:-75px;top:-110px;pointer-events:none}.display-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-bottom:10px}.angle-toggle{border:0;background:transparent;color:var(--accent2);font-size:11px;font-weight:750;letter-spacing:.1em;padding:3px 4px}.expression{width:100%;min-height:35px;text-align:right;font:500 clamp(20px,3vw,28px)/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow-x:auto;scrollbar-width:thin;color:#cbd2e2;outline:0}.result-row{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:5px}.result{font-size:clamp(32px,5vw,46px);font-weight:650;letter-spacing:-.04em;white-space:nowrap;overflow-x:auto;scrollbar-width:thin;max-width:100%}.result.error{color:var(--danger);font-size:20px;letter-spacing:0}.copy-result{border:0;background:transparent;color:var(--muted);font-size:16px;padding:6px}.copy-result:hover{color:var(--text)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.modes{display:flex;gap:6px}.mode-btn{padding:7px 13px;font-size:12px}.mode-btn.active{background:#7669e629;border-color:#7669e6;color:#c5beff}.memory{display:flex;gap:6px}.memory button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:6px}.memory button:hover{color:var(--accent2)}.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.key{height:57px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:16px;font-weight:550;transition:transform .1s,border-color .15s,background .15s;user-select:none}.key:hover{background:#242c3e;border-color:#495675}.key:active{transform:scale(.96)}.key.utility{font-size:13px;color:#b8c2d6;background:#171e2c}.key.function{font-size:13px;color:#c6bdff;background:#211f37;border-color:#353050}.key.operator{color:#c8c1ff;background:#24213c;border-color:#373356;font-size:19px}.key.danger{color:#ff9aab;background:#32202b;border-color:#4c2a38}.key.equals{background:linear-gradient(135deg,#8978ff,#6c70ec);border-color:transparent;color:#fff;font-size:22px;box-shadow:0 8px 22px #7668ed38}.key.equals:hover{background:linear-gradient(135deg,#9b8cff,#7e82ff)}.scientific{display:none}.scientific.show{display:contents}.side{padding:20px;display:flex;flex-direction:column;min-height:100%}.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.side h2{font-size:15px;margin:0}.clear-btn{font-size:11px;padding:6px 9px}.side-note{font-size:12px;color:var(--muted);margin:0 0 14px}.history-list{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:500px}.history-item{border:1px solid var(--line);background:#111622;border-radius:13px;padding:11px 12px;cursor:pointer;text-align:right;transition:.15s}.history-item:hover{border-color:#6259a5;background:#191c2c}.history-expr{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-value{font-size:17px;font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{margin:auto;text-align:center;color:var(--muted);padding:32px 10px;font-size:13px}.empty-icon{font-size:27px;margin-bottom:8px;opacity:.65}.footer{margin-top:auto;padding-top:18px;color:#707c92;font-size:11px;text-align:center}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);padding:10px 15px;background:#252c3b;border:1px solid #3b465c;border-radius:12px;color:var(--text);font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:3}.toast.show{opacity:1;transform:translate(-50%,0)}
		body.light{--bg:#edf0f7;--panel:#fff;--panel2:#f2f4fa;--line:#dce1ec;--text:#202538;--muted:#788196;--shadow:0 24px 70px #29355620;background:radial-gradient(ellipse at 15% 0%,#dcd9ff 0,transparent 35%),radial-gradient(ellipse at 100% 100%,#d5efff 0,transparent 34%),var(--bg)}body.light .display{background:linear-gradient(135deg,#f7f8fd,#f0f3fa)}body.light .expression{color:#586177}body.light .history-item{background:#f8f9fc}body.light .key.function{background:#f0edff}body.light .key.operator{background:#efedff}body.light .key.danger{background:#fff0f2}body.light .key:hover{background:#e9ecf5}
		@media(max-width:780px){.app{grid-template-columns:minmax(0,1fr);max-width:560px}.side{min-height:230px}.history-list{max-height:230px}.footer{padding-top:12px}}@media(max-width:460px){body{padding:12px}.calculator{padding:16px;border-radius:20px}.side{padding:16px;border-radius:20px}.key{height:51px;border-radius:12px}.keys{gap:7px}.display{min-height:130px;padding:15px}.toolbar{margin-bottom:10px}.memory{gap:1px}.memory button{padding:5px 4px}.topbar{margin-bottom:17px}}
	</style>
</head>
<body>
	<main class="app">
		<section class="calculator" aria-label="Calculator">
			<header class="topbar"><div class="brand"><div class="logo">÷</div><div><strong>Calcula</strong><small>Smart calculator</small></div></div><div class="top-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☼</button></div></header>
			<section class="display" aria-live="polite"><div class="display-top"><span id="status">Ready</span><button class="angle-toggle" id="angleBtn" title="Toggle degrees and radians">DEG</button></div><div class="expression" id="expression" aria-label="Expression">0</div><div class="result-row"><div class="result" id="result">0</div><button class="copy-result" id="copyBtn" title="Copy result" aria-label="Copy result">▣</button></div></section>
			<div class="toolbar"><div class="modes"><button class="mode-btn active" id="standardBtn">Standard</button><button class="mode-btn" id="scientificBtn">Scientific</button></div><div class="memory"><button data-action="memory-clear">MC</button><button data-action="memory-recall">MR</button><button data-action="memory-add">M+</button><button data-action="memory-subtract">M−</button></div></div>
			<div class="keys" id="keys">
				<button class="key function scientific" data-insert="sin(" title="Sine">sin</button><button class="key function scientific" data-insert="cos(" title="Cosine">cos</button><button class="key function scientific" data-insert="tan(" title="Tangent">tan</button><button class="key function scientific" data-insert="asin(" title="Inverse sine">sin⁻¹</button><button class="key function" data-action="backspace" title="Backspace">⌫</button>
				<button class="key function scientific" data-insert="ln(" title="Natural logarithm">ln</button><button class="key function scientific" data-insert="log(" title="Base-10 logarithm">log</button><button class="key function scientific" data-insert="sqrt(" title="Square root">√</button><button class="key function scientific" data-insert="abs(" title="Absolute value">|x|</button><button class="key danger" data-action="clear">AC</button>
				<button class="key function scientific" data-insert="π" title="Pi">π</button><button class="key function scientific" data-insert="e" title="Euler's number">e</button><button class="key function scientific" data-insert="^2" title="Square">x²</button><button class="key function scientific" data-insert="^" title="Power">xʸ</button><button class="key operator" data-insert="÷">÷</button>
				<button class="key function scientific" data-insert="(" title="Open parenthesis">(</button><button class="key function scientific" data-insert=")" title="Close parenthesis">)</button><button class="key function scientific" data-insert="!" title="Factorial">n!</button><button class="key function" data-insert="%" title="Percent">%</button><button class="key operator" data-insert="×">×</button>
				<button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key function" data-action="sign">±</button><button class="key operator" data-insert="−">−</button>
				<button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key function scientific" data-insert="1/" title="Reciprocal">1/x</button><button class="key operator" data-insert="+">+</button>
				<button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key function scientific" data-insert="^3" title="Cube">x³</button><button class="key equals" data-action="equals">=</button>
				<button class="key function scientific" data-action="ans" title="Previous answer">Ans</button><button class="key" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key function scientific" data-insert="exp(" title="Exponential function">exp</button><button class="key function" data-action="equals">↵</button>
			</div>
		</section>
		<aside class="side"><div class="side-head"><h2>Recent calculations</h2><button class="clear-btn" id="clearHistory">Clear</button></div><p class="side-note">Your calculation history is saved on this device.</p><div class="history-list" id="history"></div><div class="footer">Tip: use your keyboard for faster calculations</div></aside>
	</main>
	<div class="toast" id="toast" role="status"></div>
	<script>
		(()=>{
			const $=s=>document.querySelector(s), exprEl=$('#expression'), resultEl=$('#result'), statusEl=$('#status');
			let expression='', lastAnswer=0, memory=0, degrees=true, justCalculated=false, toastTimer;
			const safeRead=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
			let history=safeRead('calcula-history',[]), light=safeRead('calcula-light',false);
			if(light)document.body.classList.add('light');
			const fmt=n=>{if(!Number.isFinite(n))throw Error('Result is not a finite number');if(Object.is(n,-0))n=0;return Number(n.toPrecision(12)).toString()};
			function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
			function render(){exprEl.textContent=expression||'0';try{if(!expression.trim()){resultEl.textContent='0';resultEl.classList.remove('error');statusEl.textContent='Ready';return}const value=calculate(expression);resultEl.textContent=fmt(value);resultEl.classList.remove('error');statusEl.textContent='Preview'}catch(e){resultEl.textContent=e.message==='Incomplete expression'?'…':'—';resultEl.classList.remove('error');statusEl.textContent='Enter an expression'}exprEl.scrollLeft=exprEl.scrollWidth}
			function tokenize(input){let s=input.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-').replaceAll('π','pi').replace(/\s+/g,'');const tokens=[];let i=0;while(i<s.length){const rest=s.slice(i),num=rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);if(num){tokens.push({type:'num',value:Number(num[0])});i+=num[0].length;continue}const id=rest.match(/^[a-z]+/i);if(id){const name=id[0].toLowerCase();if(name==='pi'||name==='e'||name==='ans')tokens.push({type:'num',value:name==='pi'?Math.PI:name==='e'?Math.E:lastAnswer});else if(['sin','cos','tan','asin','acos','atan','sqrt','ln','log','abs','exp'].includes(name))tokens.push({type:'func',value:name});else throw Error('Unknown function');i+=id[0].length;continue}const c=s[i++];if('+-*/^()%!'.includes(c))tokens.push({type:'op',value:c});else throw Error('Invalid character')}return tokens}
			function calculate(input){let t=tokenize(input),p=0;if(!t.length)throw Error('Incomplete expression');const peek=()=>t[p],take=()=>t[p++];const match=v=>peek()?.value===v&&(take(),true);const atomStart=x=>x&&(x.type==='num'||x.type==='func'||x.value==='(');
				function primary(){let x=peek();if(!x)throw Error('Incomplete expression');if(x.type==='op'&&(x.value==='+'||x.value==='-')){take();const v=primary();return x.value==='-'?-v:v}if(x.type==='func'){take();let arg;if(match('(')){arg=addition();if(!match(')'))throw Error('Unclosed parenthesis')}else arg=primary();return applyFn(x.value,arg)}if(x.type==='num'){take();return x.value}if(match('(')){const v=addition();if(!match(')'))throw Error('Unclosed parenthesis');return v}throw Error('Incomplete expression')}
				function postfix(){let v=primary();while(peek()?.type==='op'&&(peek().value==='!'||peek().value==='%')){const op=take().value;if(op==='%')v/=100;else{if(v<0||v>170||!Number.isInteger(v))throw Error('Factorial needs an integer from 0 to 170');let n=1;for(let k=2;k<=v;k++)n*=k;v=n}}return v}
				function power(){let v=postfix();if(match('^'))v=Math.pow(v,unary());return v}
				function unary(){if(match('+'))return unary();if(match('-'))return-unary();return power()}
				function product(){let v=unary();while(peek()){if(match('*'))v*=unary();else if(match('/')){const d=unary();if(d===0)throw Error('Cannot divide by zero');v/=d}else if(match('%')){const d=unary();if(d===0)throw Error('Cannot divide by zero');v%=d}else if(atomStart(peek()))v*=unary();else break}return v}
				function addition(){let v=product();while(peek()){if(match('+'))v+=product();else if(match('-'))v-=product();else break}return v}
				const value=addition();if(p<t.length)throw Error(peek().value===')'?'Unmatched parenthesis':'Invalid expression');if(!Number.isFinite(value))throw Error('Result is not a finite number');return value
			}
			function applyFn(fn,x){const a=degrees?Math.PI/180:1;switch(fn){case'sin':return Math.sin(x*a);case'cos':return Math.cos(x*a);case'tan':return Math.tan(x*a);case'asin':return Math.asin(x)/a;case'acos':return Math.acos(x)/a;case'atan':return Math.atan(x)/a;case'sqrt':if(x<0)throw Error('Cannot take the square root of a negative number');return Math.sqrt(x);case'ln':if(x<=0)throw Error('Logarithm requires a positive number');return Math.log(x);case'log':if(x<=0)throw Error('Logarithm requires a positive number');return Math.log10(x);case'abs':return Math.abs(x);case'exp':return Math.exp(x)}}
			function insert(text){if(justCalculated&&!/^[+*/^%!)]/.test(text)&&text!=='−'&&text!=='×'&&text!=='÷')expression='';justCalculated=false;if(text==='^2'||text==='^3')expression+=text;else expression+=text;render()}
			function doEquals(){if(!expression.trim())return;try{const value=calculate(expression),shown=fmt(value),old=expression;lastAnswer=value;history.unshift({expression:old,result:shown,time:Date.now()});history=history.slice(0,50);try{localStorage.setItem('calcula-history',JSON.stringify(history))}catch{}expression=shown;justCalculated=true;statusEl.textContent='Calculated';resultEl.textContent=shown;renderHistory();render()}catch(e){resultEl.textContent=e.message;resultEl.classList.add('error');statusEl.textContent='Check expression'}}
			function renderHistory(){const box=$('#history');box.innerHTML='';if(!history.length){box.innerHTML='<div class="empty"><div class="empty-icon">◷</div>No calculations yet.<br>Your results will appear here.</div>';return}history.slice(0,30).forEach(item=>{const row=document.createElement('button');row.className='history-item';row.type='button';row.innerHTML='<div class="history-expr"></div><div class="history-value"></div>';row.querySelector('.history-expr').textContent=item.expression;row.querySelector('.history-value').textContent='= '+item.result;row.title='Reuse calculation';row.addEventListener('click',()=>{expression=item.expression;justCalculated=false;render()});box.appendChild(row)})}
			$('#keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(action==='equals')doEquals();else if(action==='clear'){expression='';justCalculated=false;resultEl.classList.remove('error');render()}else if(action==='backspace'){expression=expression.slice(0,-1);justCalculated=false;render()}else if(action==='sign'){if(!expression)expression='−';else expression='−('+expression+')';justCalculated=false;render()}else if(action==='ans')insert('Ans');else if(action?.startsWith('memory-'))memoryAction(action);else if(b.dataset.insert)insert(b.dataset.insert)});
			function memoryAction(action){try{if(action==='memory-clear'){memory=0;showToast('Memory cleared')}else if(action==='memory-recall')insert(fmt(memory));else{const v=expression?calculate(expression):lastAnswer;memory+=action==='memory-add'?v:-v;showToast('Memory updated')}}catch{showToast('Enter a valid calculation first')}}
			document.querySelectorAll('.memory button').forEach(b=>b.addEventListener('click',()=>memoryAction(b.dataset.action)));
			$('#angleBtn').addEventListener('click',()=>{degrees=!degrees;$('#angleBtn').textContent=degrees?'DEG':'RAD';render()});
			$('#standardBtn').addEventListener('click',()=>{document.body.classList.remove('scientific-mode');$('#standardBtn').classList.add('active');$('#scientificBtn').classList.remove('active');document.querySelectorAll('.scientific').forEach(x=>x.classList.remove('show'))});
			$('#scientificBtn').addEventListener('click',()=>{$('#scientificBtn').classList.add('active');$('#standardBtn').classList.remove('active');document.querySelectorAll('.scientific').forEach(x=>x.classList.add('show'))});
			$('#themeBtn').addEventListener('click',()=>{light=!light;document.body.classList.toggle('light',light);try{localStorage.setItem('calcula-light',JSON.stringify(light))}catch{}});
			$('#clearHistory').addEventListener('click',()=>{history=[];try{localStorage.removeItem('calcula-history')}catch{}renderHistory()});
			$('#copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(resultEl.textContent);showToast('Result copied')}catch{showToast('Copy is unavailable in this browser')}});
			document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9.]$/.test(e.key)){insert(e.key);return}const map={'*':'×','/':'÷','-':'−','+':'+','^':'^','%':'%','(':'(',')':')','!':'!'};if(map[e.key]){e.preventDefault();insert(map[e.key])}else if(e.key==='Enter'||e.key==='='){e.preventDefault();doEquals()}else if(e.key==='Backspace'){expression=expression.slice(0,-1);justCalculated=false;render()}else if(e.key==='Escape'){expression='';justCalculated=false;render()}});
			renderHistory();render();
		})();
	</script>
</body>
</html>
